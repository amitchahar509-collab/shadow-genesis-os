name: CI

# Typecheck / lint / test / build on every push and PR.
# Runs on Ubuntu (Bun runtime) — the standalone-copy step in `bun run build`
# only fails on the Windows Downloads junction, never on Linux.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fresh SQLite for the run — independent of the committed db/custom.db.
      # A job-level env var wins over the tracked .env (dotenv never overrides).
      DATABASE_URL: file:../db/ci.db
      GENESIS_LLM_MODEL: claude-sonnet-5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate + push (fresh schema)
        run: |
          mkdir -p db
          bun run db:generate
          bun run db:push --skip-generate

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test tests/

      - name: Build
        run: bun run build
