name: CI

# Typecheck / lint / test / build on every push and PR.
# Runs on Ubuntu (Bun runtime) — the standalone-copy step in `bun run build`
# only fails on the Windows Downloads junction, never on Linux.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read   # only needs to check out the code
    env:
      # Fresh SQLite for the run — independent of the committed db/custom.db.
      # A job-level env var wins over the tracked .env (dotenv never overrides).
      DATABASE_URL: file:../db/ci.db
      GENESIS_LLM_MODEL: claude-sonnet-5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate + push (fresh schema)
        run: |
          mkdir -p db
          bun run db:generate
          bun run db:push --skip-generate

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test tests/

      - name: Build
        run: bun run build

  # Verify the production Docker image actually builds (BuildKit → heredoc COPY works).
  # This executes the exact `docker build -t genesis .` on a Docker-capable runner,
  # turning "verified by inspection" into "verified by execution".
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read   # check out the code
      actions: write   # required by the GHA build cache (cache-to/from: type=gha)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: genesis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
